<style>
/* Layout: a French school notebook (Seyès ruling) — lessons are sticker-like cards laid on the ruled page */
:root {
  --paper: #fbfcff;
  --rule: #dfe7f8;
  --rule-strong: #c3d2f1;
  --margin: #e5484d;
  --ink: #1f2a52;
  --muted: #56628c;
  --card: #ffffff;
  --edge: #1f2a52;
  --accent: #2753c9;
  --accent-ink: #ffffff;
  --good: #1c8a4a;
  --good-bg: #e3f6ea;
  --miss: #c2410c;
  --miss-bg: #fdeee4;
  --sun: #ffd43b;
  --shadow: rgba(31, 42, 82, .9);
  --display: "Playpen Sans", "Comic Sans MS", "Chalkboard SE", ui-rounded, system-ui, sans-serif;
  --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a2f; --rule: #1d2642; --rule-strong: #27335a; --margin: #b83b45;
    --ink: #eef1fb; --muted: #a6b0cf; --card: #1b2442; --edge: #8fa3dd;
    --accent: #86a6ff; --accent-ink: #0f1630; --good: #5be08f; --good-bg: #173a2a;
    --miss: #ff9a6b; --miss-bg: #3d2318; --sun: #ffd43b; --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a2f; --rule: #1d2642; --rule-strong: #27335a; --margin: #b83b45;
  --ink: #eef1fb; --muted: #a6b0cf; --card: #1b2442; --edge: #8fa3dd;
  --accent: #86a6ff; --accent-ink: #0f1630; --good: #5be08f; --good-bg: #173a2a;
  --miss: #ff9a6b; --miss-bg: #3d2318; --sun: #ffd43b; --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule-strong) 31px 32px),
    repeating-linear-gradient(to bottom, transparent 0 7px, var(--rule) 7px 8px),
    repeating-linear-gradient(to right, transparent 0 31px, var(--rule) 31px 32px);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 48px;
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.2; margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; border-radius: 10px; }
a { color: var(--accent); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 8px 14px; border-bottom: 3px double var(--margin); margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand .bunny { font-size: 40px; line-height: 1; }
.brand b { font-family: var(--display); font-size: 1.5rem; display: block; }
.brand small { color: var(--muted); font-size: .9rem; }
.voice-switch { display: flex; align-items: center; gap: 4px; background: var(--card); border: 2px solid var(--edge);
  border-radius: 999px; padding: 3px; box-shadow: 3px 3px 0 var(--shadow); }
.vs-label { font-size: .8rem; font-weight: 800; color: var(--muted); padding: 0 6px 0 10px; text-transform: uppercase; letter-spacing: .05em; }
.voice-switch button { border: 0; background: none; cursor: pointer; font-weight: 800; padding: 6px 14px; border-radius: 999px; }
.voice-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.top-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.theme-btn { cursor: pointer; font-weight: 800; background: var(--card); border: 2px solid var(--edge); border-radius: 999px;
  padding: 8px 14px; box-shadow: 3px 3px 0 var(--shadow); }
.theme-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }

/* Shared card */
.card { background: var(--card); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 4px 4px 0 var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 2px solid var(--edge);
  background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 10px 18px; border-radius: 999px;
  box-shadow: 3px 3px 0 var(--shadow); transition: transform .1s; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn.ghost { background: var(--card); color: var(--ink); }
.eyebrow { font-family: var(--display); font-weight: 600; color: var(--margin); letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; }

/* Home */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; padding: 20px; margin-bottom: 24px; }
.hero .pierre { font-size: 84px; line-height: 1; }
.hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.bubble { display: inline-block; margin-top: 10px; background: var(--sun); color: #1f2a52; font-weight: 800;
  padding: 6px 14px; border-radius: 14px 14px 14px 2px; cursor: pointer; border: 2px solid #1f2a52; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.tile { display: flex; flex-direction: column; gap: 6px; padding: 18px; text-decoration: none; color: var(--ink);
  border-top: 10px solid var(--tone); transition: transform .15s; min-width: 0; }
.tile:hover { transform: translateY(-3px) rotate(-.5deg); }
.tile .big { font-size: 44px; line-height: 1; }
.tile h2 { font-size: 1.4rem; }
.tile .en { color: var(--muted); }
.stars { color: var(--sun); font-size: 1.2rem; letter-spacing: 2px; -webkit-text-stroke: 1px #9a7a00; }
.stars .off { color: transparent; -webkit-text-stroke: 1px var(--muted); }
.grownups { margin-top: 28px; padding: 16px 20px; }
.grownups p { margin: 6px 0 0; max-width: 70ch; color: var(--muted); }

/* Lesson */
.back { display: inline-block; margin-bottom: 12px; font-weight: 800; text-decoration: none; }
.lesson-head { padding: 20px; border-left: 12px solid var(--tone); margin-bottom: 26px; }
.lesson-head h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); }
.lesson-head p { margin: 6px 0 0; color: var(--muted); }
.section { margin-bottom: 30px; }
.section > h2 { font-size: 1.4rem; margin-bottom: 4px; }
.section > .hint { color: var(--muted); margin: 0 0 14px; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.word { cursor: pointer; text-align: center; padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 0; transition: transform .12s; }
.word:hover { transform: translateY(-2px); }
.word.playing { transform: scale(1.04) rotate(-1deg); border-color: var(--tone); }
.pic { height: 76px; display: grid; place-items: center; font-size: 56px; line-height: 1; }
.swatch { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--edge); }
.numpic { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.numpic .digit { font-family: var(--display); font-size: 44px; font-weight: 800; line-height: 1; color: var(--tone); }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 90px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--tone); display: block; }
.fr { font-family: var(--display); font-weight: 800; font-size: 1.25rem; overflow-wrap: anywhere; }
.say { font-size: .85rem; color: var(--muted); font-style: italic; }
.say b { font-style: normal; color: var(--ink); }
.word .en { font-size: .9rem; }
.chip { margin-top: 4px; font-size: .8rem; font-weight: 800; background: var(--rule); border-radius: 999px; padding: 2px 10px; border: 0; cursor: pointer; }
.phrases { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.phrase { cursor: pointer; padding: 10px 16px; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.phrase .fr { font-size: 1.05rem; }
.tip { padding: 14px 18px; border-left: 8px solid var(--sun); display: flex; gap: 12px; align-items: flex-start; }
.tip .ear { font-size: 28px; line-height: 1; }
.tip p { margin: 0; max-width: 65ch; }
.song { padding: 18px 20px; }
.song .tune { color: var(--muted); margin: 0 0 10px; }
.lyrics { display: flex; flex-direction: column; gap: 8px; }
.line { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; cursor: pointer; background: none; border: 0; padding: 6px 8px;
  text-align: left; border-radius: 10px; }
.line:hover { background: var(--rule); }
.line .fr { font-size: 1.15rem; }
.line .en { color: var(--muted); font-size: .9rem; }

/* Quiz */
.quiz { padding: 20px; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.progress { display: flex; gap: 6px; }
.progress i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--edge); display: block; }
.progress i.ok { background: var(--good); }
.progress i.no { background: var(--miss); }
.progress i.now { background: var(--sun); }
.ask { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.ask h3 { font-size: 1.3rem; }
.listen { font-size: 1.6rem; width: 64px; height: 64px; border-radius: 50%; justify-content: center; padding: 0; }
.reveal { font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--accent); }
.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.opt { cursor: pointer; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.opt .en { font-size: .9rem; color: var(--muted); text-align: center; }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--miss-bg); border-color: var(--miss); }
.opt[disabled] { cursor: default; }
.feedback { min-height: 2.2em; margin-top: 14px; font-weight: 800; font-size: 1.1rem; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.feedback.ok { color: var(--good); }
.feedback.no { color: var(--miss); }
.result { text-align: center; padding: 10px 0; }
.result .stars { font-size: 2.6rem; }
.result p { margin: 6px 0 14px; }

/* Grown-up notes */
details.notes { padding: 14px 18px; }
details.notes summary { cursor: pointer; font-weight: 800; font-family: var(--display); }
details.notes ul { margin: 10px 0 0; padding-left: 20px; }
details.notes li { margin-bottom: 6px; max-width: 70ch; }
details.notes h4 { margin: 14px 0 4px; font-size: .95rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* Certificate */
.cert { margin-top: 18px; padding: 26px 20px; text-align: center; border: 4px double var(--margin); border-radius: 16px; background: var(--card); }
.cert h3 { font-size: 1.8rem; color: var(--margin); }
.cert .who { font-family: var(--display); font-size: 1.6rem; font-weight: 800; margin: 10px 0; min-height: 1.4em; overflow-wrap: anywhere; }
.cert label { display: block; color: var(--muted); font-size: .9rem; margin-top: 10px; }
.cert input { font: inherit; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--edge); background: var(--paper); color: var(--ink); max-width: 100%; }

@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; text-align: center; }
  .hero p { margin-inline: auto; }
  .words { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .options { gap: 8px; }
  .pic { font-size: 46px; height: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

/* ---------- Storage (per-viewer stars, optional) ---------- */
function loadStars() { try { return JSON.parse(localStorage.getItem("pf-stars") || "{}"); } catch (e) { return {}; } }
function saveStars(id, s) {
  const all = loadStars();
  if ((all[id] || 0) >= s) return;
  all[id] = s;
  try { localStorage.setItem("pf-stars", JSON.stringify(all)); } catch (e) {}
}

/* ---------- Audio ----------
   Every word is pre-recorded with a neural French voice and published beside the page as audio/<id>.mp3.
   If a clip can't load, the browser's own French voice is used instead. */
const canSpeak = true;
const hasTTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
const clean = t => t.replace(/…/g, "").replace(/\s+/g, " ").trim();
function clipId(text) { let h = 5381; const s = clean(text); for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(16); }
const player = new Audio();
player.preload = "auto";
let queue = [], playingEl = null;
function stopAudio() {
  queue = []; try { player.pause(); } catch (e) {}
  if (hasTTS) try { speechSynthesis.cancel(); } catch (e) {}
  if (playingEl) { playingEl.classList.remove("playing"); playingEl = null; }
}
function ttsFallback(text, done) {
  if (!hasTTS) return done();
  try {
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /^fr[-_]FR/i.test(x.lang)) || vs.find(x => /^fr/i.test(x.lang));
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = v ? v.lang : "fr-FR"; if (v) u.voice = v; u.rate = 0.85;
    u.onend = u.onerror = done; speechSynthesis.speak(u);
  } catch (e) { done(); }
}
function playNext() {
  if (!queue.length) { if (playingEl) playingEl.classList.remove("playing"); playingEl = null; return; }
  const text = queue.shift();
  let finished = false;
  const done = () => { if (finished) return; finished = true; playNext(); };
  player.onended = done;
  player.onerror = () => { if (finished) return; finished = true; ttsFallback(text, playNext); };
  player.src = (voice === "boy" ? "audio/boy/" : "audio/") + clipId(text) + ".mp3";
  const p = player.play();
  if (p && p.catch) p.catch(err => { if (err && err.name === "AbortError") return; player.onerror(); });
}
function speak(text, el) {
  stopAudio();
  queue = Array.isArray(text) ? text.slice() : [text];
  if (el) { playingEl = el; el.classList.add("playing"); }
  playNext();
  return true;
}
/* Light / dark mode, remembered on this device (follows the system until chosen) */
(function () {
  const root = document.documentElement, btn = document.getElementById("themeBtn");
  let saved = null;
  try { saved = localStorage.getItem("pf-theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  const isDark = () => root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const paint = () => { const d = isDark(); btn.textContent = d ? "☀️ Light" : "🌙 Dark"; btn.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); };
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("pf-theme", next); } catch (e) {}
    paint();
  });
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint); } catch (e) {}
  paint();
})();

/* Girl or boy voice, remembered on this device */
let voice = "girl";
try { if (localStorage.getItem("pf-voice") === "boy") voice = "boy"; } catch (e) {}
function updatePill() {
  document.querySelectorAll(".voice-switch [data-voice]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.voice === voice)));
}
document.querySelectorAll(".voice-switch [data-voice]").forEach(b => b.addEventListener("click", () => {
  voice = b.dataset.voice;
  try { localStorage.setItem("pf-voice", voice); } catch (e) {}
  updatePill();
  speak("Bonjour");
}));
const EXTRA_CLIPS = ["Bonjour, je m'appelle Pierre !", "Bravo !", "Presque !", "Parfait !", "Très bien !", "Bon effort !"];
window.allClips = () => {
  const t = [...EXTRA_CLIPS, ...SIMON.map(s => s.fr)];
  LESSONS.forEach(l => {
    l.words.forEach(w => { t.push(w.speak || w.fr); if (w.sound) t.push(w.sound); });
    l.phrases.forEach(p => t.push(p.fr));
    l.song.lines.forEach(s => t.push(s.fr));
  });
  const seen = {}; return t.map(clean).filter(x => !seen[x] && (seen[x] = 1)).map(x => ({ text: x, id: clipId(x) }));
};

/* ---------- Helpers ---------- */
const $app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function picHTML(w) {
  if (w.swatch) return `<div class="pic"><span class="swatch" style="background:${w.swatch}"></span></div>`;
  if (w.num) return `<div class="pic"><div class="numpic"><span class="digit">${w.num}</span><span class="dots">${"<i></i>".repeat(w.num)}</span></div></div>`;
  return `<div class="pic" aria-hidden="true">${w.pic}</div>`;
}
function starsHTML(n) { return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i => i <= n ? "★" : '<span class="off">★</span>').join("")}</span>`; }

/* ---------- Quiz ---------- */
function quizIntro(box, id, pool, count, cert) {
  box.innerHTML = `<div class="result">
      <p style="font-size:1.1rem">${count} questions. Pierre says a word, you tap its picture.</p>
      <button class="btn" id="startQuiz">▶ Start the quiz</button></div>`;
  box.querySelector("#startQuiz").onclick = () => runQuiz(box, id, pool, count, cert);
}

function runQuiz(box, id, pool, count, cert) {
  const qs = shuffle(pool).slice(0, count).map(ans => {
    const others = shuffle(pool.filter(w => w.fr !== ans.fr && w.en !== ans.en)).slice(0, 2);
    return { ans, opts: shuffle([ans, ...others]) };
  });
  const results = [];
  let q = 0;

  function show() {
    const cur = qs[q];
    box.innerHTML = `
      <div class="quiz-top">
        <span class="eyebrow">Question ${q + 1} of ${count}</span>
        <span class="progress">${qs.map((_, i) => `<i class="${i < results.length ? (results[i] ? "ok" : "no") : i === q ? "now" : ""}"></i>`).join("")}</span>
      </div>
      <div class="ask">
        <button class="btn listen" id="hear" aria-label="Hear the word again">🔊</button>
        <div><h3>Which one is it?</h3><span class="reveal" id="reveal" ${canSpeak ? "hidden" : ""}>${cur.ans.fr}</span>
        ${canSpeak ? '<button class="chip" id="showWord">Show the word</button>' : ""}</div>
      </div>
      <div class="options">
        ${cur.opts.map((o, i) => `<button class="card opt" data-o="${i}" style="--tone:${o.tone}">${picHTML(o)}<span class="en">${o.en}</span></button>`).join("")}
      </div>
      <div class="feedback" id="fb" aria-live="polite"></div>`;
    const say = () => speak(cur.ans.speak || cur.ans.fr);
    box.querySelector("#hear").onclick = say;
    const sw = box.querySelector("#showWord");
    if (sw) sw.onclick = () => { box.querySelector("#reveal").hidden = false; sw.hidden = true; };
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.o));
    say();
  }

  function answer(i) {
    const cur = qs[q];
    const ok = cur.opts[i].fr === cur.ans.fr;
    results.push(ok);
    box.querySelectorAll(".opt").forEach((b, j) => {
      b.disabled = true;
      if (cur.opts[j].fr === cur.ans.fr) b.classList.add("right");
      else if (j === i) b.classList.add("wrong");
    });
    box.querySelector("#reveal").hidden = false;
    const sw = box.querySelector("#showWord"); if (sw) sw.hidden = true;
    const fb = box.querySelector("#fb");
    fb.className = "feedback " + (ok ? "ok" : "no");
    fb.innerHTML = (ok ? "Bravo ! That's right." : `Presque ! (Almost!) It was “${cur.ans.fr}”, ${cur.ans.en}.`) +
      ` <button class="btn" id="next">${q + 1 < count ? "Next →" : "See my stars"}</button>`;
    speak(ok ? "Bravo !" : ["Presque !", cur.ans.speak || cur.ans.fr]);
    const nx = box.querySelector("#next"); nx.focus(); nx.onclick = () => { q++; q < count ? show() : finish(); };
  }

  function finish() {
    const right = results.filter(Boolean).length;
    const ratio = right / count;
    const stars = ratio === 1 ? 3 : ratio >= .6 ? 2 : right > 0 ? 1 : 0;
    saveStars(id, stars);
    const passed = cert && right >= 6;
    const msg = stars === 3 ? "Parfait ! Perfect!" : stars === 2 ? "Très bien ! Very good!" : "Bon effort ! Good try!";
    box.innerHTML = `<div class="result">
      ${starsHTML(stars)}
      <h3 style="font-size:1.6rem;margin-top:6px">${msg}</h3>
      <p>You got ${right} of ${count} right.</p>
      <button class="btn" id="again">↻ Play again</button>
      ${!cert ? ' <a class="btn ghost" href="#">Back to lessons</a>' : ""}
    </div>
    ${passed ? `<div class="cert">
      <span class="eyebrow">Certificat</span>
      <h3>Petit Français</h3>
      <p>This certificate is awarded to</p>
      <div class="who" id="certName">…</div>
      <p>for learning greetings, numbers, colours, family and animals in French.<br>Pierre le Lapin dit : <b>Bravo !</b></p>
      <p class="say">${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</p>
      <label for="certInput">Type your name</label>
      <input id="certInput" maxlength="30" placeholder="Je m'appelle…">
    </div>` : cert ? `<p class="hint" style="text-align:center">Get 6 of 8 to earn your certificate. Essaie encore ! (Try again!)</p>` : ""}`;
    speak(msg.split("!")[0] + " !");
    box.querySelector("#again").onclick = () => runQuiz(box, id, pool, count, cert);
    const ci = box.querySelector("#certInput");
    if (ci) ci.oninput = () => { box.querySelector("#certName").textContent = ci.value.trim() || "…"; };
  }
  show();
}

/* ---------- Router ---------- */
function route() {
  const h = location.hash.replace("#", "");
  const l = LESSONS.find(x => x.id === h);
  stopAudio();
  if (l) renderLesson(l); else if (h === "fete") renderFete(); else renderHome();
  window.scrollTo(0, 0);
  updatePill();
}
window.addEventListener("hashchange", route);
route();
</script>
